# BIRD-Dev preprocessing
#   python -m src.preprocess.run_all --config config/preprocess/bird_dev.toml

[dataset]
type = "bird"
split = "dev"
root_path = "data/bird"
save_path = "preprocess_space/dataset/bird/dev.pkl"

[vector_database]
# Local embedding model path or Hugging Face model ID.
embedding_model_name_or_path = "/path/to/models/Qwen/Qwen3-Embedding-0.6B"
api_type = "local"
use_qwen3_embedding = true
local_files_only = false
normalize_embeddings = false
store_root_path = "preprocess_space/vector_database/bird/dev"
max_value_length = 100
batch_size = 1024
n_parallel = 1
lower_meta_data = true

[value_retrieval]
n_results = 5
n_parallel = 16
save_path = "preprocess_space/value_retrieval/bird/dev.pkl"
max_retry = 3

[value_retrieval.llm]
model = "Qwen/Qwen2.5-Coder-32B-Instruct"
base_url = "http://0.0.0.0:9999/v1"
api_key = "dummy"
max_tokens = 4096
temperature = 0.7
api_type = "openai"
fix_end_token = false

[output]
save_path = "data/preprocessed/bird_task/dev/tasks.pkl"
max_example_length = 100
