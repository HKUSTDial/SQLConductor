# GRPO training configuration for the Qwen3-8B meta agent
# Workers use port 9999; the policy model is loaded locally.


rl:
  # Path to the merged SFT model.
  base_model_path: "/path/to/model/Qwen/Qwen3-8B"

  training:
    epochs: 2
    batch_size: 1
    group_size: 4
    learning_rate: 1e-6
    beta: 0.1          # KL divergence coefficient
    lambda: 0.8        # Outcome/executability reward balance
    curriculum_threshold: 0.5  # Retain questions with an MCTS success ratio below this value.

    # Per-trajectory timeout in seconds.
    rollout_timeout: 300

    gradient_accumulation_steps: 4

    serial_group_processing: true

  checkpoint:
    save_every_steps: 10
    max_checkpoints: 3

    gated_best:
      enabled: true
      kl_threshold: 0.05
      use_reward_ema: true
      ema_alpha: 0.1

    kl_warning_threshold: 0.1

  lora:
    enabled: true
    r: 64
    lora_alpha: 128
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"

  quantization:
    enabled: true
    load_in_8bit: true


system:
  log_level: "INFO"
  async_workers: true
  result_cache: true
  cache_ttl: 3600
  schema_max_length: 28000

  paths:
    train_tasks: "data/preprocessed/bird_task/train/tasks.pkl"

    # MCTS trajectory summary generated by script/train/traj/traj_sft_data_processing.sh
    oracle_summary: "trajectory/bird/train/trajectory_sft_data_summary.json"

    output_dir: "checkpoints/rl_gdpo_qwen3_8b_v1"

  data:
    dataset: "bird"
    split: "train"
    database_root_dir: "data/bird/train/train_databases"

  logging:
    main_process_only: true
    suppress_modules:
      - "src.system.workers"
      - "src.system.meta_agent"


models:
  default:
    base_url: "http://localhost:9999/v1"
    api_key: "sk-demo"
    model_name: "Qwen/Qwen2.5-Coder-32B-Instruct"
    temperature: 0.8
    top_p: 0.8
    max_tokens: 16384
    timeout: 60


meta_agent:
  model_port: 9999    # HTTP policy port; RL uses the local policy model.
  temperature: 0.8
  max_tokens: 4096
  max_turns: 8

workers:
  Schema Pruner:
    temperature: 0.8
    max_retries: 3

  Value Extractor:
    temperature: 0.8
    max_retries: 3

  Operation Identifier:
    temperature: 0.8
    max_retries: 3

  SQL Constructor:
    temperature: 0.8
    max_retries: 3

  SQL Refiner:
    temperature: 0.8
    max_retries: 3

  Question Decomposer:
    temperature: 0.8
    max_retries: 3
